    activeVariantKind = kind;
    variantMode = 'highlighted';
    _vpHighlightChip(kind);
    renderPatchTags();
  } else if (variantMode === 'highlighted' && activeVariantKind === kind) {
    activeVariantKind = null;
    variantMode = 'idle';
    _vpUnhighlightAll();
    renderPatchTags();
  } else if (variantMode === 'highlighted' && activeVariantKind !== kind) {
    activeVariantKind = kind;
    _vpUnhighlightAll();
    _vpHighlightChip(kind);
    renderPatchTags();
  } else if (variantMode === 'applied') {
    // applied → 同 chip 仅 undo 回 idle; 不同 chip 才 undo+highlight 新方案
    const wasKind = activeVariantKind;
    undoVariant();                  // 清空 activeVariantKind + variantMode='idle'
    if (kind === wasKind) return;
    activeVariantKind = kind;
    variantMode = 'highlighted';
    _vpHighlightChip(kind);
    renderPatchTags();
  }
}

function _vpHighlightChip(kind) {
  const chip = document.querySelector(`.vp-chip[data-kind="${kind}"]`);
  if (!chip) return;
  chip.classList.add('active');
  // 插入 "应用此方案" link (如果还没有)
  if (!chip.querySelector('.vp-chip-apply')) {
    const a = document.createElement('span');
    a.className = 'vp-chip-apply';
    a.textContent = '应用此方案';
    a.onclick = (e) => { e.stopPropagation(); applyVariant(kind); };
    chip.appendChild(a);
  }
}

function _vpUnhighlightAll() {
  document.querySelectorAll('.vp-chip').forEach(c => {
    c.classList.remove('active');
    const a = c.querySelector('.vp-chip-apply');
    if (a) a.remove();
  });
}

function applyVariant(kind) {
  const set = variantPatchSets.find(v => v.kind === kind);
  if (!set || !(set.patches?.length)) return;
  const mainEntry = variantStops['main'];
  if (!mainEntry || !Array.isArray(mainEntry.stops)) return;

  // 锁定 baseStops 一次 (再次 apply 会先 undo, baseStops 已被 undo 清回 null)
  if (!baseStops) {
    baseStops = JSON.parse(JSON.stringify(mainEntry.stops));
  }

  // swap: 在 mainEntry.stops 上 mutate 每个 patch 指向的 stop 字段
  for (const patch of (set.patches || [])) {
    const idx = patch.stop_idx;
    const stop = mainEntry.stops[idx];
    if (!stop || !patch.to) continue;
    stop.poi_openshopid = patch.to.openshopid || stop.poi_openshopid;
    stop.poi_name = patch.to.name || stop.poi_name;
    stop.longitude = (typeof patch.to.longitude === 'number') ? patch.to.longitude : stop.longitude;
    stop.latitude = (typeof patch.to.latitude === 'number') ? patch.to.latitude : stop.latitude;
    stop.categories = Array.isArray(patch.to.categories) ? patch.to.categories : stop.categories;
    // slot / arrival / leave / star / avgprice 保留原 stop 值 (B 方案: 同槽位换 POI, 不重算)
  }

  variantMode = 'applied';
  _vpRerenderMainDay();
  _vpShowToast(set.label);
}

function undoVariant() {
  if (!baseStops) {
    _vpHideToast();
    variantMode = 'idle';
    activeVariantKind = null;
    _vpUnhighlightAll();
    return;
  }
  const mainEntry = variantStops['main'];
  if (mainEntry) {
    mainEntry.stops = JSON.parse(JSON.stringify(baseStops));
  }
  baseStops = null;
  variantMode = 'idle';
  activeVariantKind = null;
  _vpUnhighlightAll();
  _vpRerenderMainDay();
  _vpHideToast();
}

function _vpRerenderMainDay() {
  const dayIndex = 0;
  const mainEntry = variantStops['main'];
  if (!mainEntry || !Array.isArray(mainEntry.stops)) return;
  const stops = mainEntry.stops;
  const color = (typeof DAY_COLORS !== 'undefined' && DAY_COLORS[dayIndex]) || '#ff3e00';

  // 1. 清旧 markers — 用 map.remove 真删 (setMap(null) 在频繁 swap 下偶有 stale 残留)
  if (typeof map !== 'undefined' && map) {
    (markersByDay[dayIndex] || []).forEach(m => { if (m) { try { map.remove(m); } catch (_) {} } });
    // 二次保险: 扫地图当前所有 marker, 除 anchorMarker 外都清 (防追踪数组遗漏的 stale)
    if (typeof map.getAllOverlays === 'function') {
      const all = map.getAllOverlays('marker') || [];
      for (const m of all) {
        if (m && m !== anchorMarker) {
          try { map.remove(m); } catch (_) {}
        }
      }
    }
  }
  markersByDay[dayIndex] = [];

  // 2a. 清 pending polylineQueue 同 day 项 (防 async worker 把 stale line 推回新数组)
  if (typeof polylineQueue !== 'undefined' && Array.isArray(polylineQueue)) {
    for (let qi = polylineQueue.length - 1; qi >= 0; qi--) {
      if (polylineQueue[qi].dayIndex === dayIndex) polylineQueue.splice(qi, 1);
    }
  }
  // 2b. 清旧 polylines
  (polylinesByDay[dayIndex] || []).forEach(l => { if (l) l.setMap(null); });
  polylinesByDay[dayIndex] = [];

  // 3. 清旧 stop cards in day-group-content
  const container = (typeof dayGroupContentByIndex !== 'undefined') ? dayGroupContentByIndex[dayIndex] : null;
  if (container) {
    container.innerHTML = '';
  }

  // 4. dayCardsByIndex 清掉该 day 的 entries
  if (typeof dayCardsByIndex !== 'undefined') {
    for (const key of Array.from(dayCardsByIndex.keys())) {
      if (key.startsWith(`${dayIndex}-`)) dayCardsByIndex.delete(key);
    }
  }

  // 5. 重新画 stop cards + markers
  for (let i = 0; i < stops.length; i++) {
    if (container) {
      pushPlaceCard(stops[i], dayIndex, i, color, container, null);
    }
    if (typeof map !== 'undefined' && map && typeof SVC !== 'undefined' && SVC.drive) {
      addMarker(stops[i], dayIndex, i, color);
    }
  }

  // 6. 画 estimated 灰虚线 (apply 后不重跑 AMap 路由, 评委一眼看出 "preview" 状态)
  if (typeof map !== 'undefined' && map) {
    for (let i = 0; i < stops.length - 1; i++) {
      const a = stops[i], b = stops[i + 1];
      if (typeof a.longitude === 'number' && typeof a.latitude === 'number'
       && typeof b.longitude === 'number' && typeof b.latitude === 'number') {
        drawEstimatedLine([a.longitude, a.latitude], [b.longitude, b.latitude], dayIndex);
      }
    }
  }

  // 7. fit map
  if (typeof fitMapToAllMarkers === 'function') {
    try { fitMapToAllMarkers(); } catch {}
  }

  // 8. 重画 inline patch tags (apply 后保留 tag 在新 swap 完的 stops 旁)
  if (typeof renderPatchTags === 'function') renderPatchTags();
}

function _vpShowToast(label) {
  const el = document.getElementById('vpToast');
  if (!el) return;
  el.innerHTML = '';
  const text = document.createTextNode(`已应用 [${label}] · `);
  el.appendChild(text);
  const btn = document.createElement('button');
  btn.textContent = '撤销';
  btn.onclick = undoVariant;
  el.appendChild(btn);
  el.hidden = false;
}

function _vpHideToast() {
  const el = document.getElementById('vpToast');
  if (el) el.hidden = true;
}

// ── v1.10 Clarify Round ──────────────────────────────────────────────────────
function renderClarifyQuestion(data, tripId) {
  const { idx, text, options } = data;
  const wrap = document.createElement('div');
  wrap.className = 'chat-msg bot clarify-question-wrap';

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);

  const chips = document.createElement('div');
  chips.className = 'clarify-chips';

  const allOptions = [...options, '自定义…'];
  allOptions.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'clarify-chip';
    btn.textContent = (i < options.length ? String.fromCharCode(65 + i) + ' ' : 'D ') + opt;
    btn.addEventListener('click', () => {
      if (opt === '自定义…') {
        _showCustomInput(wrap, idx, tripId);
      } else {
        _submitAnswer(idx, opt, false, tripId, wrap);
      }
    });
    chips.appendChild(btn);
  });

  const skipBtn = document.createElement('button');
  skipBtn.className = 'clarify-chip clarify-skip';
  skipBtn.textContent = '跳过 →';
  skipBtn.addEventListener('click', () => _submitAnswer(idx, null, true, tripId, wrap));
  chips.appendChild(skipBtn);

  wrap.appendChild(chips);
  $('messages').appendChild(wrap);
  $('messages').scrollTop = $('messages').scrollHeight;

  const timeout = setTimeout(() => _submitAnswer(idx, null, true, tripId, wrap), 30000);
  wrap._clarifyTimeout = timeout;
}

function _showCustomInput(wrap, idx, tripId) {
  if (wrap.querySelector('.clarify-custom-input')) return;
  const row = document.createElement('div');
  row.className = 'clarify-custom-input';
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.placeholder = '输入你的想法…';
  inp.className = 'clarify-custom-text';
  const confirmBtn = document.createElement('button');
  confirmBtn.textContent = '确认';
  confirmBtn.className = 'clarify-chip';
  confirmBtn.addEventListener('click', () => {
    if (inp.value.trim()) _submitAnswer(idx, inp.value.trim(), false, tripId, wrap);
  });
  row.appendChild(inp);
  row.appendChild(confirmBtn);
  wrap.appendChild(row);
  inp.focus();
}

async function _submitAnswer(idx, choice, skipped, tripId, wrap) {
  if (wrap._clarifyTimeout) clearTimeout(wrap._clarifyTimeout);
  wrap.querySelectorAll('.clarify-chip').forEach(b => b.disabled = true);

  if (!skipped && choice) pushMsg('user', choice);

  const resp = await fetch(`/api/plan/${tripId}/answer`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ idx, choice: skipped ? null : choice, skipped }),
  });
  if (!resp.ok || !resp.body) return;

  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const blocks = buf.split('\n\n');
    buf = blocks.pop() || '';
    for (const blk of blocks) {
      let ev = '', dat = null;
      for (const line of blk.split('\n')) {
        if (line.startsWith('event:')) ev = line.slice(6).trim();
        if (line.startsWith('data:')) {
          try { dat = JSON.parse(line.slice(5).trim()); } catch (_) {}
        }
      }
      if (!ev) continue;
      handleSSEEvent(ev, dat);
    }
  }
}
